name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d market_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/market_research
      LLM_MODE: test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      AUTH_DEV_BYPASS: "false"
      LLM_LOG_FILE: ""
      PERSIST_REQUEST_EVENTS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 libcairo2 shared-mime-info fonts-dejavu-core

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Ruff lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy app

      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

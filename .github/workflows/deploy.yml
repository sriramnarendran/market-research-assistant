name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ secrets.ACR_LOGIN_SERVER != '' && secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER%%.azurecr.io}}"
          az acr login --name "$ACR_NAME"

      - name: Build and push backend image
        env:
          IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/market-research-backend:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -f backend/Dockerfile -t "$IMAGE" -t "${{ secrets.ACR_LOGIN_SERVER }}/market-research-backend:latest" backend
          docker push "$IMAGE"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/market-research-backend:latest"

      - name: Update Container App image
        if: ${{ secrets.AZURE_CONTAINER_APP_NAME != '' }}
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/market-research-backend:${{ github.sha }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
